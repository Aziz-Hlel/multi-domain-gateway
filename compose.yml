
services:
  gateway:
    image: caddy:2.6.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - gateway-data:/data
      - gateway-config:/config

    networks:
      - ygp-network
      - volto-network
      - schoolranking-network
      - luxuria-network
      - teres-network
      - jj-network

volumes:
  gateway-data:
  gateway-config:


networks:
  ygp-network :
    external: true
  schoolranking-network :
    external: true
  volto-network :
    external: true
  luxuria-network :
    external: true
  teres-network :
    external: true
  jj-network :
    external: true
